name: legacy comparison preflight

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate the no-key source contract
        run: |
          python3 scripts/validate_source_list.py

      - name: Upload source-list evidence
        uses: actions/upload-artifact@v4
        with:
          name: aether-comparison-preflight-${{ github.run_id }}
          path: news_websites.csv
          retention-days: 14
