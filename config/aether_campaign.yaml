name: Aether AEC Evergreen Outreach
description: Person-level outreach for qualified Arizona AEC opportunities.
channel: email
timezone: America/Phoenix
dailySendLimit: 150
sendingWindowStart: 8
sendingWindowEnd: 16
scheduleDays: [1, 2, 3, 4, 5]
stopOnReply: true
stopOnBounce: true
stopOnUnsubscribe: true
trackOpens: true
trackClicks: false
mailboxIds: []
steps:
  - stepIndex: 0
    type: email
    subject: "A facilities idea for {{company}}"
    bodyHtml: >-
      <p>{{whyLine}}</p>
      <p>This is a commercial message from Aether Facility Services.</p>
      <p><img src="{{AETHER_SIGNATURE_LOGO_URL}}" alt="Aether Facility Services logo" width="160" style="display:block;max-width:160px;height:auto;"></p>
      <p>Jordan Whitehurst, Partner<br>Aether Facility Services, LLC<br>O: (602) 612-6393<br>M: (813) 992-0858<br>2120 W Encanto Blvd, Phoenix, AZ 85009</p>
      <p><a href="{{unsubscribeUrl}}">Unsubscribe</a><br>{{AETHER_POSTAL_ADDRESS}}</p>
    bodyText: |-
      {{whyLine}}

      This is a commercial message from Aether Facility Services.

      Jordan Whitehurst, Partner
      Aether Facility Services, LLC
      O: (602) 612-6393
      M: (813) 992-0858
      2120 W Encanto Blvd, Phoenix, AZ 85009

      Unsubscribe: {{unsubscribeUrl}}
      {{AETHER_POSTAL_ADDRESS}}
    delayDays: 0
    delayHours: 0
    isActive: true
