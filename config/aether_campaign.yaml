    subject: "Following up on facilities support for {{company}}"
    bodyHtml: >-
      <p>Hi {{firstName}},</p>
      <p>I wanted to follow up in case my note arrived at a busy time. Aether supports commercial properties with recurring cleaning and on-demand facility services, with one point of contact and work tailored to each site.</p>
      <p>Is this something you oversee, or is there someone else at {{company}} I should contact?</p>
      <p>This is a commercial message from Aether Facility Services.</p>
